name: Tests

# Runs the Django test suite on every push and pull request to the
# long-lived branches. Before this existed, the project's ~1,500 tests only
# ran when a developer remembered to type the command, and the pre-commit
# test hook was commented out - so nothing anywhere enforced a green suite.
on:
  push:
    branches: [main, beta, dev]
  pull_request:
    branches: [main, beta, dev]

concurrency:
  # A newer push to the same branch makes an in-flight run irrelevant.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # This is that "separate change, measured on its own" the note above
    # used to promise. Measured in an isolated, CI-matching environment
    # (own Postgres 16 + Redis, same fake credentials this workflow uses):
    # the untouched suite took 2428.6s (~40.5min) at --parallel 1; a fast
    # test-password-hasher plus two unrelated test-only bugs (a cleanup-
    # ordering mistake that made one test wait out a 60s timeout it didn't
    # need to, and two fixture-heavy query-count proofs sized far past what
    # their exact-equality assertions actually need) brought that to 849.6s
    # serial; --parallel 4 on top of that measured 309.25s (~5min9s) - a
    # 7.85x reduction overall, verified safe under real concurrency (not
    # just "tests still pass"): a per-process Redis key-prefix bug that
    # only --parallel's fork semantics could expose was found and fixed for
    # both the Django cache and the Celery broker/result backend, pinned by
    # two dedicated regression tests, and Postgres connections were watched
    # live during full runs (peaked at 33 of 100, comfortable margin).
    #
    # 309s is the number this box produced; a GitHub-hosted runner's CPU
    # count, and therefore how well 4 workers actually overlap, has not
    # been measured directly. 20 minutes below is a deliberately generous
    # multiple of the measured number, not a tightened new floor - lower it
    # once a real run here confirms the actual CI time, the same way the
    # old 60-minute cap should have been revisited once --parallel landed
    # instead of left at "the suite plus margin" indefinitely.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: gradeaplus_ci
        ports:
          - 5432:5432
        # Without this the job races the container and fails on connect.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # settings.py reads ENVIRONMENT to choose which DB/Redis/Stripe keys
      # to look up; "local" is the branch that points at the *_LOCAL vars
      # wired to the service containers above.
      ENVIRONMENT: local
      SECRET_KEY: ci-secret-key-not-used-outside-ci  # pragma: allowlist secret
      FRONTEND_DOMAIN: http://localhost:3000
      # Deliberately distinct from FRONTEND_DOMAIN - students and teachers
      # use separate frontend apps, and this keeps CI actually exercising
      # that separation instead of only ever hitting the fallback branch.
      STUDENT_FRONTEND_DOMAIN: http://localhost:3001
      DATABASE_URI_LOCAL: postgres://postgres:postgres@localhost:5432/gradeaplus_ci  # pragma: allowlist secret
      REDIS_LOCAL_URL: redis://localhost:6379/0
      # Every value below is required at import time by settings.py. They
      # are deliberately fake: the suite mocks all outbound calls, and a CI
      # run must never be able to reach a real Stripe, Cloudinary, or
      # mail provider.
      LOCAL_STRIPE_PUBLIC_KEY: pk_test_ci
      LOCAL_STRIPE_SECRET_KEY: sk_test_ci  # pragma: allowlist secret
      LOCAL_STRIPE_WEBHOOK_SECRET: whsec_ci  # pragma: allowlist secret
      CLOUDINARY_CLOUD_NAME: ci
      CLOUDINARY_API_KEY: ci  # pragma: allowlist secret
      CLOUDINARY_API_SECRET: ci  # pragma: allowlist secret
      MAILSEND_API_KEY: ci  # pragma: allowlist secret
      GOOGLE_OAUTH_CLIENT_ID: ci
      GOOGLE_OAUTH_CLIENT_SECRET: ci  # pragma: allowlist secret
      GOOGLE_REDIRECT_URI: http://localhost:3000/auth/google
      # ai_processor/services.py reads this at module import with no default,
      # and users.views -> ... -> ai_processor.services is on the URLconf
      # import chain, so without it Django cannot even load urls.py.
      OPENROUTER_API_KEY: sk-or-ci-not-a-real-key  # pragma: allowlist secret
      # Fernet key for encrypted_model_fields: must base64-decode to EXACTLY
      # 32 bytes or users/models.py fails at import and every step dies
      # before it runs. This one decodes to b"ci-test-key-not-for-production!!".
      FIELD_ENCRYPTION_KEY: Y2ktdGVzdC1rZXktbm90LWZvci1wcm9kdWN0aW9uISE=  # pragma: allowlist secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        # Mirrors the Dockerfile: OCR and PDF handling need these present
        # before the Python packages that bind to them will import.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr poppler-utils libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        # Catches a model change committed without its migration, which
        # otherwise surfaces as a confusing failure on deploy.
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        # --parallel 4, not "auto": auto picks this runner's CPU count,
        # which this suite has not been measured against and may not match
        # the box these numbers came from. 4 is deliberately conservative -
        # measured locally at 33 peak Postgres connections (of 100), wide
        # margin even with the suite's several "twenty simultaneous
        # connections" stress tests, and a 7.85x wall-clock speedup on its
        # own (see the timeout comment below for the actual numbers this
        # is based on).
        run: coverage run manage.py test --noinput --parallel 4

      - name: Combine coverage from parallel workers
        # `--parallel` runs tests in forked worker processes, each writing
        # its OWN `.coverage.*` data file (`.coveragerc`'s
        # `concurrency = multiprocessing` is what makes that happen at
        # all) - `coverage report` below reads ONE combined file, not many
        # partial ones. Skipping this step would make the coverage
        # percentage silently collapse to whatever the tiny dispatcher
        # process itself executed, not what the suite actually covers.
        run: coverage combine

      - name: Coverage report
        # Reported for visibility only - deliberately NOT failing the build
        # on a coverage threshold. A percentage gate pressures people into
        # writing assertion-free tests that raise the number without
        # catching anything.
        run: coverage report -m
