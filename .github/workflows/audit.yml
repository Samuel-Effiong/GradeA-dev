name: Dependency audit

# H-258: known vulnerabilities in requirements.txt (pip-audit, pinned), on
# every push and pull request to the long-lived branches, and once a week so
# a new advisory shows up without a push. The advisories accepted for now are
# in .pip-audit-ignore.toml, each with a reason and a review date; the runner
# (scripts/pip_audit_gate.py) fails once a review date has passed.
#
# The weekly run audits the default branch (GitHub runs schedules there).
on:
  push:
    branches: [main, beta, dev]
  pull_request:
    branches: [main, beta, dev]
  schedule:
    # Mondays 06:17 UTC.
    - cron: "17 6 * * 1"

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only pip-audit is installed: with every requirement pinned, it audits
      # the listed versions without installing them (--no-deps --disable-pip).
      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.9.0"

      - name: Audit requirements.txt
        run: python scripts/pip_audit_gate.py
