[tool.bandit]
exclude_dirs = ['tests', 'venv', 'docs']
tests = ['B101', 'B102']

[tool.mypy]
# Without this plugin, mypy has no knowledge of Django's metaclass-generated
# attributes: models.TextChoices members read back as the raw (value, label)
# tuple instead of str, ForeignKey "_id" shadow attributes don't exist,
# Manager[Model] loses its model-specific methods, etc. See
# docs/evidence/mypy_django_stubs/EVIDENCE.md for the before/after error
# counts this produced on the whole repo.
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "AutoGrader.settings"

# Ratchet: modules that had >=1 real mypy error at the time django-stubs/
# djangorestframework-stubs were wired in (task/mypy-django-stubs). Each of
# these 159 modules is individually silenced so pre-existing errors do not
# block unrelated commits (language: system runs mypy on every commit, see
# .pre-commit-config.yaml); every module NOT listed here is clean today and
# stays fully strict, so a fresh error anywhere else still fails the hook.
# Remove an entry individually as that module gets cleaned up. Full
# file:line list: docs/evidence/mypy_django_stubs/EVIDENCE.md and
# docs/evidence/mypy_django_stubs/mypy_after_whole_repo.txt. Backlog: H-46
# in docs/HARDENING_BACKLOG.md.
