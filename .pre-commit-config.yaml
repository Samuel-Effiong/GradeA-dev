repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
        # The generated backend-reference HTML embeds the Mermaid renderer and
        # the IBM Plex font payloads verbatim. Rewriting bytes inside those is
        # not a whitespace tidy-up, it is editing a vendored binary-ish blob.
        exclude: ^docs/backend/.*\.html$
    -   id: check-ast
    -   id: check-docstring-first
    -   id: check-added-large-files
        # Same files: single-file documentation editions are a few MB because
        # the renderer and fonts are inlined so they open with no network. The
        # 500KB guard still applies to everything else.
        exclude: ^docs/backend/.*\.html$
    -   id: check-merge-conflict
    -   id: check-toml
    -   id: check-json
    -   id: check-xml
    -   id: check-case-conflict
    -   id: check-builtin-literals
    -   id: fix-byte-order-marker
    -   id: detect-private-key
    -   id: name-tests-test
        # This repo names tests test_*.py / tests_*.py (Django's convention,
        # 48 files). The hook's default expects the opposite (*_test.py), so
        # without --django it rejects every test file in the project.
        args: [--django]
    -   id: debug-statements
    -   id: check-symlinks
    -   id: requirements-txt-fixer

-   repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
    -   id: black
        language_version: python3
        args: [--line-length=88]

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v1.17.1'  # Use the sha / tag you want to point at
    hooks:
    -   id: mypy
        args: [--ignore-missing-imports, --check-untyped-defs, --disable-error-code=var-annotated]
        additional_dependencies: [types-requests,  types-redis, types-waitress, types-python-dateutil, types-bleach]

-   repo: https://github.com/pycqa/flake8 # Linting with Flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        language_version: python3
        additional_dependencies:
          - setuptools<81
          - flake8-bugbear==23.7.10
          - flake8-comprehensions==3.12.0
          - flake8-docstrings==1.7.0
          - flake8-import-order==0.18.2
          - flake8-print==5.0.0
          - flake8-rst-docstrings==0.3.1
          - flake8-eradicate==1.5.0
        args:
          - --max-line-length=120                  # Matches Black's line length
          - --select=B,C,E,F,W,T4,B9                          # Enable common checks
          - --ignore=W503,E203      # Align with Black formatting
          # E800 (flake8-eradicate, commented-out code) is ON for the whole repository.
          # The files below are its only exceptions. Each one has a reason, an owner
          # and a staged cleanup plan in docs/HARDENING_BACKLOG.md H-12. Never add to
          # this list and never carve out a whole directory; remove a file's entry in
          # the same commit that cleans it. students/ and dashboard/ are fully clean.
          - --per-file-ignores=ai_processor/services.py:E800 assignments/admin.py:E800 assignments/serializers.py:E800 assignments/tasks.py:E800 assignments/tests_rigor.py:E800 assignments/views.py:E800 AutoGrader/settings.py:E800 AutoGrader/urls.py:E800 billing/access_control.py:E800 billing/license_service.py:E800 billing/license_views.py:E800 billing/live_qa/invariants_individual.py:E800 billing/management/commands/backfill.py:E800 billing/models.py:E800 billing/serializers.py:E800 billing/services.py:E800 billing/stripe_service.py:E800 billing/stripe_view_schemas.py:E800 billing/tasks.py:E800 billing/tests/tests.py:E800 billing/views.py:E800 classrooms/models.py:E800 classrooms/serializers.py:E800 classrooms/test_bulk_enrollment.py:E800 classrooms/test_views.py:E800 classrooms/views.py:E800 users/models.py:E800 users/serializers.py:E800 users/services.py:E800 users/tests_throttle_client_identity.py:E800 users/views.py:E800
        exclude: (^|/)migrations/
    # Sort imports automatically with isort
-   repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
    -   id: isort                       # Ensure imports are sorted
        args: [--profile=black]         # Align with Black's rules
# -   repo: local
#     hooks:
#     -   id: run-tests
#         name: Run test before commit
#         entry: pytest
#         language: system
#         pass_filenames: false
#         always_run: true
 # Security checks - Bandit
-   repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        exclude: "tests/|examples/|docs/|setup.py"

  # Check for secrets in code
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: 'tests/|examples/|docs/'

  # gunicorn's --timeout and billing/webhooks.py's
  # WEBHOOK_REQUEST_HARD_TIMEOUT_SECONDS are the same load-bearing value in
  # two files - see the comments at both sites. This catches one being
  # changed without the other.
-   repo: local
    hooks:
      - id: check-gunicorn-timeout-sync
        name: Check gunicorn timeout stays in sync with Stripe webhook claim window
        entry: python scripts/check_gunicorn_timeout_sync.py
        language: system
        files: ^(Dockerfile|billing/webhooks\.py)$
        pass_filenames: false
